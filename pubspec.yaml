name: toauner_workspace
publish_to: none
environment:
  sdk: ^3.12.0

workspace:
  - app
  - packages/tuner_audio
  - packages/tuner_data
  - packages/tuner_domain
  - packages/tuner_dsp

dev_dependencies:
  lints: ^6.0.0
  melos: ^8.2.1

melos:
  sdkPath: .tools/flutter
  command:
    bootstrap:
      runPubGetInParallel: false
  scripts:
    analyze:
      description: Analyze the full Dart and Flutter workspace.
      run: flutter analyze
    test:
      description: Run every workspace package test suite.
      exec:
        command: flutter test
        concurrency: 1
    format:
      description: Check Dart formatting without changing files.
      run: dart format --output=none --set-exit-if-changed .
